security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # ⬇️ AJOUT ICI
    role_hierarchy:
        ROLE_DEV:        [ROLE_ADMIN, ROLE_SUPPORT, ROLE_OPERATEUR, ROLE_USER, ROLE_ALLOWED_TO_SWITCH]
        ROLE_ADMIN:      [ROLE_SUPPORT, ROLE_OPERATEUR, ROLE_USER]
        ROLE_SUPPORT:    [ROLE_OPERATEUR, ROLE_USER]
        ROLE_OPERATEUR:  [ROLE_USER]
        # ROLE_USER: []  # inutile de le définir

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            access_denied_handler: App\Security\AccessDeniedHandler
            custom_authenticator: App\Security\LoginFormAuthenticator
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_index
                always_use_default_target_path: true
            entry_point: App\Security\LoginFormAuthenticator

            logout:
                path: app_logout
                target: app_login

            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            # switch_user: true   # tu peux l’activer si besoin (impersonation)

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/logout, roles: PUBLIC_ACCESS }
        - { path: ^/device/approve, roles: PUBLIC_ACCESS }
        - { path: ^/admin/devices, roles: ROLE_ADMIN }
        - { path: ^/admin/agences, roles: ROLE_ADMIN }
        - { path: ^/(manifest\.webmanifest|sw\.js|offline|icons/), roles: PUBLIC_ACCESS }
        - { path: ^/api/read, roles: ROLE_USER }
        - { path: ^/api/write, roles: ROLE_USER }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
